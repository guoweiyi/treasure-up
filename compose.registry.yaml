# Source checkout override; release deployment bundles already select these images.
# Pull first, then up --no-build --pull never; never build over release image tags.
x-registry-backend: &registry-backend
  image: ${TREASURE_BACKEND_IMAGE:-docker.io/${DOCKERHUB_NAMESPACE:-yunyunjuan}/treasure-up-backend:0.3.9}

services:
  init: *registry-backend
  api: *registry-backend
  scheduler: *registry-backend
  collector: *registry-backend
  download-worker: *registry-backend
  media-worker: *registry-backend
  backup-worker: *registry-backend
  web:
    image: ${TREASURE_WEB_IMAGE:-docker.io/${DOCKERHUB_NAMESPACE:-yunyunjuan}/treasure-up-web:0.3.9}
