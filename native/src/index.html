<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>连接 Treasure Up</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main><header class="introduction"><div class="brand" aria-hidden="true">T</div><p class="eyebrow">YOUR PRIVATE VIDEO LIBRARY</p><h1>连接你的 Treasure Up</h1><p class="lead">打开自己的视频库，继续上次的观看。</p></header><section class="connection-card" aria-label="服务器连接">
<form id="connect"><label for="origin">服务器或 API 地址</label><input id="origin" type="url" inputmode="url" enterkeyhint="go" autocapitalize="none" autocorrect="off" aria-describedby="origin-hint status" placeholder="https://video.example.com" autocomplete="url" required maxlength="2048" spellcheck="false"><p class="hint" id="origin-hint">支持站点首页或 /api/v1 地址。远程连接使用 HTTPS；本机开发可用 http://localhost:8788。</p><button id="submit" type="submit">连接服务器</button></form>
<p id="status" role="status" aria-live="polite"></p><button id="forget" class="secondary" type="button">清除连接与客户端登录数据</button><footer>客户端仅保存服务器地址。登录与媒体保存在你的服务器；B 站 Cookie 和存储密钥不进入客户端。</footer></section></main></body></html>
