name: TreasureUp
options:
  bundleIdPrefix: com.guoweiyi
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
targets:
  TreasureUp:
    type: application
    platform: iOS
    sources: [TreasureUp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoweiyi.treasureup
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TreasureUp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
  TreasureUpTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TreasureUpTests]
    dependencies:
      - target: TreasureUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TreasureUpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TreasureUpUITests]
    dependencies:
      - target: TreasureUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TreasureUp:
    build:
      targets:
        TreasureUp: all
    test:
      targets: [TreasureUpTests, TreasureUpUITests]
