# Optional: docker compose -f compose.yaml -f compose.light.yaml up -d --build
# Keep metadata responsive; only download and media processing share a worker.
services:
  media-worker:
    profiles: [full-workers]
  download-worker:
    profiles: [full-workers]
  worker:
    extends:
      file: compose.yaml
      service: collector
    command: [celery, -A, "app.worker:celery", worker, -Q, "download,media", "--concurrency=1", "--loglevel=WARNING"]
