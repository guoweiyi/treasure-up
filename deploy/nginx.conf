resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
limit_req_zone $binary_remote_addr zone=playback_creation:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=danmaku_requests:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=danmaku_clients:10m;
limit_conn_zone $server_name zone=danmaku_total:1m;
upstream treasure_api {
    zone treasure_api 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;

    location ~ ^/api/v1/playback-sessions/?$ {
        limit_req zone=playback_creation burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://treasure_api;
    }

    location ~ ^/api/v1/parts/[^/]+/danmaku/?$ {
        limit_req zone=danmaku_requests burst=10 nodelay;
        limit_req_status 429;
        limit_conn danmaku_clients 4;
        limit_conn danmaku_total 16;
        limit_conn_status 429;
        proxy_pass http://treasure_api;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://treasure_api;
        proxy_read_timeout 120s;
    }
    location /health {
        proxy_pass http://treasure_api/health;
    }
    location /protected-media/ {
        internal;
        alias /data/media/;
        sendfile on;
        tcp_nopush on;
        max_ranges 1;
        add_header Cache-Control "private, max-age=300" always;
        include /etc/nginx/security-headers.conf;
    }
    location /assets/ {
        try_files $uri =404;
        # Vite names are content-hashed. Compress once at build time, not per viewer.
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }
    location /userscripts/ {
        try_files $uri =404;
        add_header Cache-Control no-cache;
        include /etc/nginx/security-headers.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        include /etc/nginx/security-headers.conf;
    }
}
