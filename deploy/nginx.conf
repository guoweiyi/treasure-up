resolver 127.0.0.11 valid=10s ipv6=off;
upstream treasure_api {
    zone treasure_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://treasure_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /health {
        proxy_pass http://treasure_api/health;
        proxy_set_header Host $http_host;
    }
    location /protected-media/ {
        internal;
        alias /data/media/;
        sendfile on;
        tcp_nopush on;
        max_ranges 1;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
