# Include in every context that defines add_header: nginx does not inherit
# parent add_header directives once a child declares any of its own.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
