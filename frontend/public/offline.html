<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#303e7f" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>连接视频库 · Treasure Up</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font:
          16px system-ui,
          sans-serif;
        color: #303e7f;
        background: #edf3ff;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main {
        padding: 32px 24px;
        width: 400px;
        min-width: 0;
        max-width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #dbe5f7;
        border-radius: 20px;
      }
      img {
        width: 168px;
        height: 190px;
        object-fit: contain;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-top: 24px;
      }
      p {
        color: #67738b;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 9px;
        background: #303e7f;
        color: white;
        text-decoration: none;
        margin-top: 12px;
      }
      a:hover {
        background: #263266;
      }
      a:focus-visible {
        outline: 3px solid #789dde;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #151c32;
        }
        main {
          border-color: #384567;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/brand/logo-lockup-256.png"
        srcset="/brand/logo-lockup-256.png 1x, /brand/logo-lockup-512.png 2x"
        alt="Treasure Up"
        width="168"
        height="190"
      />
      <h1>暂时无法连接视频库</h1>
      <p>请检查网络及服务端是否运行，再回来继续浏览收藏。</p>
      <a href="/">重新连接</a>
    </main>
  </body>
</html>
