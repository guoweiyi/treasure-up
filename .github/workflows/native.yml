name: Native clients
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable commit or ref to build; empty uses the caller ref.
        required: false
        type: string
        default: ''
  push:
    branches: ['**']
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
permissions:
  contents: read
concurrency:
  group: native-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.target }} compile and package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Prepare Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Cache Rust dependencies for this desktop target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/src-tauri -> target
          key: desktop-${{ matrix.target }}
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Compile and test native navigation policy
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Compile native application and package installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treasure-up-${{ matrix.target }}
          path: |
            native/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            native/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
  android:
    name: Android debug APK compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep the Android debug variant and assertions, without shipping Rust DWARF.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: debuginfo
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android build tools on the disposable CI runner
        run: |
          sdkmanager --list > "$RUNNER_TEMP/android-sdk-packages.txt"
          grep -E 'platforms;android-36[[:space:]]|build-tools;36.0.0[[:space:]]|ndk;28.2.13676358[[:space:]]' "$RUNNER_TEMP/android-sdk-packages.txt"
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Cache Rust dependencies for Android ARM64
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/src-tauri -> target
          key: android-aarch64-linux-android-debug-no-dwarf
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST NDK_HOME
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Test APK artifact checks
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: npm run build
      - run: npm run tauri -- android init --ci --skip-targets-install
      - name: Pin generated Android project to verified stable SDK and wrapper checksum
        run: npm run android:prepare
      - name: Compile ARM64 debug APK without release credentials
        run: npm run tauri -- android build --debug --apk --target aarch64 --ci -- --locked
      - name: Verify APK contents and report reduction from v0.3.1
        run: python3 scripts/audit_apk.py src-tauri/gen/android/app/build/outputs/apk --baseline-bytes 159797407
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treasure-up-android-debug
          path: native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
  ios-simulator:
    name: Swift iOS simulator compile and tests
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/apple
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - name: Select installed Xcode with iOS 26.1 or newer SDK
        run: |
          python3 - <<'PYCODE'
          import pathlib, re, subprocess
          candidates = []
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              sdk = app / 'Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs'
              versions = [tuple(map(int, m.group(1).split('.'))) for p in sdk.glob('iPhoneOS*.sdk') if (m := re.search(r'iPhoneOS(\d+(?:\.\d+)*)\.sdk', p.name))]
              if versions and max(versions) >= (26, 1):
                  candidates.append((max(versions), str(app / 'Contents/Developer')))
          if not candidates:
              raise SystemExit('This native target requires an installed iOS 26.1+ SDK; update the runner image.')
          subprocess.run(['sudo', 'xcode-select', '--switch', max(candidates)[1]], check=True)
          PYCODE
          xcodebuild -version
      - name: Compile the pure Swift app
        run: xcodebuild -project TreasureUp.xcodeproj -scheme TreasureUp -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build
      - name: Run native regression tests on an available iPhone
        run: |
          python3 - <<'PYCODE'
          import json, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          phones = [(tuple(map(int, m.group(1).split('-'))), d) for runtime, rows in devices.items() if (m := re.search(r'iOS-([0-9-]+)$', runtime)) and int(m.group(1).split('-')[0]) >= 18 for d in rows if d.get('isAvailable') and d['name'].startswith('iPhone')]
          phones.sort(key=lambda entry: (entry[0], entry[1]['name']))
          if not phones:
              raise SystemExit('No available iPhone simulator runtime')
          subprocess.run(['xcodebuild','-project','TreasureUp.xcodeproj','-scheme','TreasureUp','-destination','platform=iOS Simulator,id='+phones[-1][1]['udid'],'-derivedDataPath','build','-only-testing:TreasureUpTests','CODE_SIGN_IDENTITY=-','CODE_SIGNING_ALLOWED=YES','test'],check=True)
          PYCODE
      - name: Archive simulator bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/TreasureUp.app ../ios-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treasure-up-ios-simulator-unsigned
          path: native/ios-simulator.zip
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
