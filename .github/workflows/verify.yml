name: Verify
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Audit locked npm dependencies without running package scripts
        run: |
          npm --prefix frontend audit --package-lock-only --ignore-scripts
      - name: Audit locked Python dependencies in a disposable tool environment
        run: |
          python3 -m venv .audit
          .audit/bin/python -m pip install pip-audit==2.10.1 pytest==9.1.1 PyYAML==6.0.3
          .audit/bin/python -m pip_audit -r backend/requirements.lock --no-deps --disable-pip --progress-spinner off
      - name: Deployment and release packaging tests
        run: .audit/bin/python -m pytest deploy/tests -q
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Build local images and cache database dependencies
        run: |
          python3 deploy/setup.py
          docker compose build
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          docker build -f deploy/Dockerfile.setup -t "treasure-up-setup:$VERSION" .
          docker compose pull postgres redis
      - name: Verify a source-free Docker-only installation
        env:
          TREASURE_RUN_INSTALL_TESTS: '1'
        run: |
          python3 -m venv .install-tests
          .install-tests/bin/python -m pip install pytest==9.1.1 PyYAML==6.0.3
          .install-tests/bin/python -m pytest deploy/tests/test_install_container.py -q
