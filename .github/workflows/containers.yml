name: Docker Hub images (reusable)
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    inputs:
      source_ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      reuse_existing:
        description: Reuse already-promoted immutable images when retrying an existing version.
        type: boolean
        default: false
permissions:
  contents: read
env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'yunyunjuan' }}
jobs:
  reuse:
    if: inputs.source_ref == inputs.revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reused: ${{ steps.reuse.outputs.reused || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Reuse immutable images only when their revision and both platforms match
        if: inputs.reuse_existing
        id: reuse
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
        run: python3 deploy/container_release.py reuse --tag "$RELEASE_TAG" --revision "$REVISION" --output release-images.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.reuse.outputs.reused == 'true'
        with:
          name: release-images
          path: release-images.json
          if-no-files-found: error
          overwrite: true
  build:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend for the native runner architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: treasure-up-backend:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=release-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-backend-${{ matrix.arch }}
      - name: Build web for the native runner architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: treasure-up-web:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=release-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-web-${{ matrix.arch }}
      - name: Test the exact images before registry upload
        env:
          VERSION: ${{ inputs.version }}
          TREASURE_RUN_INSTALL_TESTS: '1'
        run: |
          docker run --rm "treasure-up-backend:$VERSION" python -m compileall -q app
          python3 deploy/setup.py
          docker compose pull postgres redis
          python3 -m venv .image-checks
          .image-checks/bin/python -m pip install pytest==9.1.1 PyYAML==6.0.3
          .image-checks/bin/python -m pytest deploy/tests/test_install_container.py -q
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested images and record their registry digests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: python3 deploy/container_release.py push --tag "$RELEASE_TAG" --revision "$REVISION" --arch "$ARCH" --output image-digests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-digests-${{ matrix.arch }}
          path: image-digests/*.json
          if-no-files-found: error
          overwrite: true
  merge:
    needs: [reuse, build]
    if: needs.reuse.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: container-digests-*
          path: image-digests
      - name: Merge only tested platforms from this workflow run
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
        run: python3 deploy/container_release.py merge --tag "$RELEASE_TAG" --revision "$REVISION" --input image-digests --output release-images.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images
          path: release-images.json
          if-no-files-found: error
          overwrite: true
