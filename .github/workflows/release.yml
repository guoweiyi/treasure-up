name: Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '版本操作：自动递增、指定新版本，或重试已有版本'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, custom, retry]
      version:
        description: '仅 custom / retry 填写，例如 0.4.0 或 v0.4.0'
        required: false
        type: string
      channel:
        description: 'stable 更新 latest；preview 只更新 preview；retry 沿用原版本渠道'
        default: preview
        required: true
        type: choice
        options: [preview, stable]
permissions:
  contents: read
concurrency:
  group: treasure-up-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release branch and Docker Hub configuration
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'yunyunjuan' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo 'Run releases from the default branch'; exit 1; }
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN" || { echo 'Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets'; exit 1; }
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[a-z0-9][a-z0-9_-]{1,38}', os.environ['DOCKERHUB_NAMESPACE']):
              raise SystemExit('Invalid Docker Hub namespace; use the username or organization name.')
          PY
      - name: Choose the next or existing version
        id: resolve
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 deploy/release.py resolve "$REQUESTED_VERSION" --mode "$RELEASE_MODE"
      - name: Prepare release source and reserve its tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'yunyunjuan' }}
        run: |
          set -euo pipefail
          # Exit on API/authentication errors instead of treating them as a missing release.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/published-tags"; then
            echo 'Version already published; choose a new version.'; exit 1
          fi
          if [ "$RELEASE_MODE" = retry ]; then
            git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" "origin/$DEFAULT_BRANCH"
            git show "refs/tags/$RELEASE_TAG:release.json" > "$RUNNER_TEMP/retry-release.json"
            python3 - <<'PY'
          import json, os
          release = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'retry-release.json')))
          if release.get('distribution') != 'dockerhub':
              raise SystemExit('This tag predates Docker Hub releases. Choose patch/minor/major to publish a new version.')
          PY
            git checkout --detach "refs/tags/$RELEASE_TAG"
            python3 deploy/release.py check "$RELEASE_TAG"
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
            python3 deploy/release.py prepare "$RELEASE_TAG" --channel "$CHANNEL" --automatic-notes
            python3 deploy/release.py check "$RELEASE_TAG"
            python3 -m venv .release-checks
            .release-checks/bin/python -m pip install pytest==9.1.1 PyYAML==6.0.3
            .release-checks/bin/python -m pytest deploy/tests -q
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add release.json frontend/package.json frontend/package-lock.json backend/app/main.py compose.yaml compose.registry.yaml compose.registry.light.yaml compose.setup.yaml "docs/releases/$RELEASE_TAG.md"
            git commit -m "chore: 发布 $RELEASE_TAG"
            git tag -a "$RELEASE_TAG" -m "Treasure Up $RELEASE_TAG"
            # Authenticate only this operation; never persist the token or depend on a tag-triggered run.
            git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
          fi
          python3 - <<'PY'
          import json, os, subprocess
          release = json.load(open('release.json'))
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version': release['version'], 'channel': release['channel'], 'revision': revision}.items():
                  output.write(f'{key}={value}\n')
          PY
  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ needs.prepare.outputs.revision }}
  ios:
    needs: prepare
    uses: ./.github/workflows/ios.yml
    with:
      source_ref: ${{ needs.prepare.outputs.revision }}
  containers:
    needs: [prepare, verify]
    uses: ./.github/workflows/containers.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.prepare.outputs.revision }}
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      revision: ${{ needs.prepare.outputs.revision }}
      reuse_existing: ${{ inputs.mode == 'retry' }}
  package:
    needs: [prepare, verify, ios, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: treasure-up-ios-unsigned
          path: native-artifacts/treasure-up-ios-unsigned
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-images
          path: container-artifacts
      - name: Package tested images, Compose installer and device IPA
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'yunyunjuan' }}
        run: |
          python3 -m venv .release-tools
          .release-tools/bin/python -m pip install PyYAML==6.0.3
          .release-tools/bin/python deploy/release.py package "$RELEASE_TAG" --artifacts native-artifacts --images container-artifacts/release-images.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --output release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
  promote:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-images
          path: container-artifacts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote verified digests without replacing versions or downgrading channels
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'yunyunjuan' }}
        run: python3 deploy/container_release.py promote --tag "$RELEASE_TAG" --revision "$REVISION" --channel "$CHANNEL" --input container-artifacts/release-images.json
  publish:
    needs: [prepare, package, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish checked release attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_flags=()
          if [ "$CHANNEL" = preview ]; then release_flags+=(--prerelease); fi
          cd release-assets
          sha256sum --check SHA256SUMS
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$existing" = true || { echo 'Refusing to replace a published release'; exit 1; }
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --draft "${release_flags[@]}" --verify-tag --title "Treasure Up $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/remote-assets"
          printf '%s\n' * | sort > "$RUNNER_TEMP/expected-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/remote-assets"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$([ "$CHANNEL" = preview ] && echo true || echo false)" --notes-file RELEASE-NOTES.md
