name: iOS client
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit SHA to build; empty uses the caller SHA.
        required: false
        type: string
        default: ''
  push:
    branches: ['**']
    paths: ['native/apple/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['native/apple/**', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    name: ${{ matrix.device }} offline regression tests
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    defaults:
      run:
        working-directory: native/apple
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          expected = os.environ['SOURCE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if not re.fullmatch(r'[0-9a-fA-F]{40}', expected) or actual.lower() != expected.lower():
              raise SystemExit('The iOS workflow requires the exact checked-out commit SHA.')
          PYCODE
      - name: Select installed Xcode with iOS 26.1 or newer SDK
        run: |
          python3 - <<'PYCODE'
          import pathlib, re, subprocess
          candidates = []
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              sdk = app / 'Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs'
              versions = [tuple(map(int, m.group(1).split('.'))) for p in sdk.glob('iPhoneOS*.sdk') if (m := re.search(r'iPhoneOS(\d+(?:\.\d+)*)\.sdk', p.name))]
              if versions and max(versions) >= (26, 1):
                  candidates.append((max(versions), str(app / 'Contents/Developer')))
          if not candidates:
              raise SystemExit('This iOS target requires an installed iOS 26.1+ SDK; update the runner image.')
          subprocess.run(['sudo', 'xcode-select', '--switch', max(candidates)[1]], check=True)
          PYCODE
          xcodebuild -version
      - name: Select and boot simulator
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          candidates = [(tuple(map(int, match.group(1).split('-'))), device, runtime)
                        for runtime, rows in devices.items()
                        if (match := re.search(r'iOS-([0-9-]+)$', runtime)) and int(match.group(1).split('-')[0]) >= 18
                        for device in rows if device.get('isAvailable') and device['name'].startswith(os.environ['DEVICE_FAMILY'])]
          if not candidates:
              raise SystemExit('No available ' + os.environ['DEVICE_FAMILY'] + ' simulator with iOS 18 or newer.')
          _, device, runtime = max(candidates, key=lambda entry: (entry[0], entry[1]['name']))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_UDID=' + device['udid'] + '\n')
          pathlib.Path('../ios-simulator-build.json').write_text(json.dumps({
              'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'sdk': subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip(),
              'device': device['name'], 'runtime': runtime, 'signing': 'ad-hoc', 'platform': 'iOS Simulator'
          }, indent=2) + '\n')
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          PYCODE
      - name: Run unit and offline player interaction tests
        run: |
          # Ad-hoc signing is required by the Keychain regression tests.
          # Explicit test selectors exclude the online SmokeTests suite.
          xcodebuild -project TreasureUp.xcodeproj -scheme TreasureUp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build -resultBundlePath "build/TestResults-${{ matrix.device }}.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -only-testing:TreasureUpTests \
            -only-testing:TreasureUpUITests/OfflinePlayerInteractionTests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - name: Verify and archive simulator app
        if: matrix.device == 'iPhone'
        run: |
          codesign --verify --deep --strict build/Build/Products/Debug-iphonesimulator/TreasureUp.app
          python3 - <<'PYCODE'
          import json, pathlib, plistlib, subprocess
          path = pathlib.Path('../ios-simulator-build.json')
          info = json.loads(path.read_text())
          bundle = pathlib.Path('build/Build/Products/Debug-iphonesimulator/TreasureUp.app')
          app = plistlib.loads((bundle / 'Info.plist').read_bytes())
          info['app_version'] = app['CFBundleShortVersionString']
          info['build_number'] = app['CFBundleVersion']
          info['architectures'] = subprocess.check_output(['lipo', '-archs', 'build/Build/Products/Debug-iphonesimulator/TreasureUp.app/TreasureUp'], text=True).strip().split()
          path.write_text(json.dumps(info, indent=2) + '\n')
          PYCODE
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/TreasureUp.app ../ios-simulator.zip
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('../ios-simulator.zip', 'a', compression=zipfile.ZIP_DEFLATED) as archive:
              archive.write('../ios-simulator-build.json', 'ios-simulator-build.json')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.device == 'iPhone'
        with:
          name: treasure-up-ios-simulator
          path: native/ios-simulator.zip
          overwrite: true
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results-${{ matrix.device }}-attempt-${{ github.run_attempt }}
          path: native/apple/build/TestResults-${{ matrix.device }}.xcresult
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
